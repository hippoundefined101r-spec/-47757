<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM — MEBEL FLOW</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="bar"><div class="logo">MEBEL<i>FLOW</i></div><nav><a class="active" href="/crm">Заявки</a><a href="/content">Контент</a><a href="/" target="_blank">Сайт ↗</a><a href="#" onclick="logout()">Выйти</a></nav></header><main class="admin"><div class="title"><div><div class="kicker">ПРОДАЖИ</div><h1>Заявки и сделки</h1></div><div class="stat"><b id="due">0</b><span>нуждаются<br>в дожиме</span></div></div><div id="board" class="kanban"></div></main><script src="/static/common.js"></script><script>
const S=[['new','Новые'],['contacted','Связались'],['measure','Замер'],['estimate','Расчёт'],['contract','Договор'],['production','Производство'],['install','Монтаж'],['done','Готово'],['lost','Отказ']];async function setStatus(id,status){await api(`/api/lead/${id}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}async function del(id){if(!confirm('Удалить заявку?'))return;await api(`/api/lead/${id}/delete`,{method:'POST'});load()}function card(x){const overdue=x.followup_due&&new Date(x.followup_due)<=new Date()&&!['done','lost'].includes(x.status);const pics=(x.photos||'').split(',').filter(Boolean).slice(0,3).map(p=>`<a target="_blank" href="/uploads/${esc(p)}"><img src="/uploads/${esc(p)}"></a>`).join('');return `<article class="lead ${overdue?'overdue':''}"><div class="leadtop"><strong>#${x.id} ${esc(x.product)}</strong><span>${esc((x.created_at||'').slice(5,16).replace('T',' '))}</span></div><h3>${esc(x.name)}</h3><a class="phone" href="tel:${esc(x.phone)}">${esc(x.phone)}</a><div class="tags"><span>${esc(x.budget||'Бюджет не указан')}</span><span>${esc(x.city||'Город не указан')}</span>${x.dimensions?`<span>${esc(x.dimensions)}</span>`:''}</div>${x.comment?`<p>${esc(x.comment)}</p>`:''}${pics?`<div class="thumbs">${pics}</div>`:''}<select onchange="setStatus(${x.id},this.value)">${S.map(([k,l])=>`<option value="${k}" ${k===x.status?'selected':''}>${l}</option>`).join('')}</select>${overdue?'<div class="follow">⚡ Клиента пора дожать</div>':''}<button class="danger" onclick="del(${x.id})">Удалить</button></article>`}async function load(){const d=await api('/api/leads');document.getElementById('due').textContent=d.leads.filter(x=>x.followup_due&&new Date(x.followup_due)<=new Date()&&!['done','lost'].includes(x.status)).length;document.getElementById('board').innerHTML=S.map(([k,l])=>{const arr=d.leads.filter(x=>x.status===k);return `<section class="col"><div class="colhead"><span>${l}</span><b>${arr.length}</b></div>${arr.map(card).join('')}</section>`}).join('')}requireAuth().then(load)
</script></body></html>
