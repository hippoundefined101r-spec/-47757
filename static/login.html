<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — MEBEL FLOW</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="login"><form id="login" class="panel"><div class="logo">MEBEL<i>FLOW</i></div><h1>Панель владельца</h1><p>Пароль задаётся через ADMIN_PASSWORD.</p><input id="password" type="password" placeholder="Пароль" required><button class="btn acid full">Войти</button><div id="msg" class="msg"></div><a href="/" style="text-align:center;color:var(--muted);font-size:12px">← На сайт</a></form></div><script src="/static/common.js"></script><script>api('/api/me').then(x=>{if(x.authenticated)location='/crm'});document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});location='/crm'}catch(err){document.getElementById('msg').textContent=err.message}})</script></body></html>
