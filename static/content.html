<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Контент — MEBEL FLOW</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="bar"><div class="logo">MEBEL<i>FLOW</i></div><nav><a href="/crm">Заявки</a><a class="active" href="/content">Контент</a><a href="/" target="_blank">Сайт ↗</a><a href="#" onclick="logout()">Выйти</a></nav></header><main class="admin"><div class="title"><div><div class="kicker">КОНТЕНТ</div><h1>Одна работа → несколько площадок</h1></div></div><div class="content-layout"><form id="add" class="card fields sticky"><h2 style="margin:0">Добавить работу</h2><label>Название<input name="title" required placeholder="Кухня «Графит»"></label><label>О проекте<textarea name="description" rows="4" placeholder="Что сделали, чем проект интересен"></textarea></label><div class="two"><label>Материал<input name="material" placeholder="МДФ, шпон..."></label><label>Стоимость<input name="price" placeholder="420 000 ₽"></label></div><label>Город<input name="city" placeholder="Махачкала"></label><label>Фото<input type="file" name="photos" multiple accept="image/*"></label><button class="btn acid full">Сохранить и подготовить посты</button><div id="msg" class="msg"></div></form><div id="list" class="content-list"></div></div></main><script src="/static/common.js"></script><script>
let ready=false;async function publish(id){try{await api(`/api/content/${id}/publish-telegram`,{method:'POST'});load()}catch(e){alert(e.message)}}async function del(id){if(!confirm('Удалить работу?'))return;await api(`/api/content/${id}/delete`,{method:'POST'});load()}function copy(id){const t=document.getElementById('tg'+id);navigator.clipboard.writeText(t.value)}function item(x){const pics=(x.photos||'').split(',').filter(Boolean).slice(0,4).map(p=>`<img src="/uploads/${esc(p)}">`).join('');return `<article class="content-card"><div class="content-head"><div><small>${esc((x.created_at||'').slice(0,16).replace('T',' '))}</small><h3>${esc(x.title)}</h3></div><span class="pill ${x.published_tg?'yes':''}">${x.published_tg?'Telegram ✓':'Не опубликовано'}</span></div>${pics?`<div class="pics">${pics}</div>`:''}<details open><summary>Telegram</summary><textarea id="tg${x.id}" readonly>${esc(x.tg_caption)}</textarea></details><details><summary>VK</summary><textarea readonly>${esc(x.vk_caption)}</textarea></details><details><summary>Instagram</summary><textarea readonly>${esc(x.ig_caption)}</textarea></details><div class="actions"><button class="btn dark" onclick="publish(${x.id})">Опубликовать в Telegram</button><button class="btn dark" onclick="copy(${x.id})">Скопировать</button><button class="danger" onclick="del(${x.id})">Удалить</button></div></article>`}async function load(){const d=await api('/api/content');ready=d.telegram_ready;document.getElementById('list').innerHTML=d.items.length?d.items.map(item).join(''):'<div class="empty">Пока нет работ. Добавьте первую — она сразу появится в портфолио сайта.</div>'}document.getElementById('add').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('msg');try{await api('/api/content/add',{method:'POST',body:new FormData(e.target)});m.classList.add('ok');m.textContent='Готово. Работа уже появилась на сайте.';e.target.reset();load()}catch(err){m.classList.remove('ok');m.textContent=err.message}});requireAuth().then(load)
</script></body></html>
